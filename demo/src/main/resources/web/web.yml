sys:
  web:
    intercept:
      enabled: false
      configs:
        "[org.zero.web.interceptor.CustomInterceptor]":
          intercepted-paths: "/**"
          excluded-paths: "/resource/**"
    cors:
      enabled: false
      configs:
        "[/**]":
          allowed-origins: "*"
          allowed-headers: "*"
          allowed-methods: "*"
          exposed-headers: "*"
          allow-credentials: true
          max-age: 3600
    resource:
      enabled: true
      configs:
        # 本地上传路径
        "[/sys/upload/**]":
          # 结尾必须加"/"，不然映射不到
          locations:
            - "file:///C:/Users/Zero/Data/Upload/"
            - "file:/home/zero/data/upload/"
          cache-max-age: 12
          time-unit: HOURS
        # swagger
        "[/swagger-ui/**]":
          locations:
            - "classpath:/META-INF/resources/webjars/springfox-swagger-ui/"
          cache-max-age: 6
    view:
      enabled: false
      configs:
        - type: View
          src: "/"
          dest: index
