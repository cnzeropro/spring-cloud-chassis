# https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.server.server.address
# org.springframework.boot.autoconfigure.web.ServerProperties
# 服务器配置
server:
  # 服务绑定的端口。默认：8080
  port: 8080
  # 服务绑定的地址
  address:
  # 服务关闭策略。默认：immediate（立即）。可选：immediate、graceful
  shutdown: graceful
  # 最大HTTP header大小，默认：8KB
  max-http-header-size: 8KB
  # 服务器响应头（响应时自动添加）
  server-header:
  # Forward相关请求头处理策略。可选：none、native、framework
  forward-headers-strategy:
  # servlet配置
  servlet:
    # ContextPath。默认：/
    context-path: /
    # 是否注册Default Servlet。默认：false
    register-default-servlet: false
    # Servlet上下文初始化参数
    context-parameters:
    # 应用程序的显示名称。默认：application
    application-display-name: application
    # 服务器HTTP编码
    encoding:
      # 是否启用HTTP编码支持
      enabled: true
      # HTTP请求和响应的字符集。如果未显式设置，则添加到“Content-Type”标头中。默认：UTF-8
      charset: UTF-8
      # 是否在HTTP的请求和响应上强制编码为配置的字符集
      force:
      # 是否在HTTP的请求上强制编码为配置的字符集
      force-request:
      # 是否在HTTP的响应上强制编码为配置的字符集
      force-response:
      # 将语言环境与响应编码的字符集做映射
      mapping:
    # JSP配置
    jsp:
      # 是否注册了JSP servlet。默认：true
      registered: true
      # JSP的servlet类名。如果registered为true，并且此类在classpath中，则它将被注册。默认：org.apache.jasper.servlet.JspServlet
      class-name: org.apache.jasper.servlet.JspServlet
      # JSP servlet初始化参数。默认：development=false
      init-parameters:
        development: false
    # 会话配置
    session:
      # 会话过期时间
      timeout: 30m
      # 会话跟踪模式。可选：cookie、url、ssl
      tracking-modes:
      # 是否在重启时保留会话数据
      persistent: false
      # 存储会话数据的目录
      store-dir:
      # cookie配置
      cookie:
        # cookie注释
        comment:
        # cookie名称
        name:
        # cookie域
        domain:
        # cookie路径
        path:
        # 是否使用“HttpOnly” cookie
        http-only:
        # 是否始终将Cookie标记为安全
        secure:
        # Cookie的最长期限
        max-age:
        # Cookie的SameSite设置。可选：none、lax、strict
        same-site:
  # reactive配置（与servlet配置二选一）
  reactive:
    # 会话配置
    session:
      # 会话超时时间。默认：30m
      timeout: 30m
      # cookie配置
      cookie:
        # cookie名称
        name:
        # cookie域
        domain:
        # cookie路径
        path:
        # 是否使用“HttpOnly” cookie
        http-only:
        # 是否始终将Cookie标记为安全
        secure:
        # Cookie的最长期限
        max-age:
        # Cookie的SameSite设置。可选：none、lax、strict
        same-site:
  # 响应压缩配置
  compression:
    # 是否进行响应压缩。默认：false
    enabled: true
    # 执行压缩所需的最小“Content-Length”值。默认2KB
    min-response-size: 2KB
    # 需要压缩的响应的MIME类型。默认：text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    mime-types:
    # 不应压缩的响应的用户代理。默认未指定
    excluded-user-agents:
  # Tomcat配置（三大嵌入式服务器选一即可）（SpringBoot默认）
  tomcat:
    # Tomcat线程配置
    threads:
      # 最大工作线程数。默认：200
      max: 200
      # 最小工作线程数。默认：10
      min-spare: 10
    # 服务器在任何给定时间接受和处理的最大连接数。达到限制后，操作系统仍可能接受基于“acceptCount”属性的连接。默认：8192
    max-connections: 8192
    # 连接请求的最大队列长度。默认：100
    accept-count: 100
    # 将保留在缓存中并在后续请求中重用的空闲处理器的最大数量。当设置为-1时，缓存将是无限的，但理论上的最大大小等于最大连接数。默认：200
    processor-cache: 200
    # 在连接关闭之前，可以通过管道传输的最大HTTP请求数。设置为0或1时，将禁用保持活动状态和流水线。设置为-1时，允许无限数量的流水线请求或保持连接请求。默认：100
    max-keep-alive-requests: 100
    # 连接器在接受连接后等待显示请求URI行的时间
    connection-timeout:
    # 在连接关闭之前等待另一个 TTP请求的时间。如果未设置，则使用“connectionTimeout”。设置为 -1 时，不会出现超时
    keep-alive-timeout:
    # 解码URI的字符编码，默认：UTF-8
    uri-encoding: UTF-8
    # HTTP表单内容的最大大小。默认：2MB
    max-http-form-post-size: 2MB
    # 请求正文的最大大小。默认：2MB
    max-swallow-size: 2MB
    # URI路径中应允许的其他未编码字符。只允许使用“< > [ \ ] ^ ' { | }”
    relaxed-path-chars:
    # URI查询字符串中应允许的其他未编码字符。只允许使用“< > [ \ ] ^ ' { | }”
    relaxed-query-chars:
    # Tomcat基目录。如果未指定，则使用临时目录
    basedir:
    # 调用backgroundProcess方法之间的延迟。默认：10s
    background-processor-delay: 10s
    # 是否应通过将/附加到路径来重定向对上下文根的请求。默认：true
    redirect-context-root: true
    # 调用sendRedirect生成的HTTP 1.1及更高版本的位置标头是使用相对重定向还是绝对重定向。默认：false
    use-relative-redirects: false
    # 额外的TLD跳转匹配模式
    additional-tld-skip-patterns:
    # 访问日志配置
    accesslog:
      # 是否启用访问日志，默认：false
      enabled: false
      # 访问日志的格式模式。默认：common
      pattern: common
      # 日志文件目录。可以是绝对目录，也可以是相对于Tomcat基目录的。默认：logs
      directory: logs
      # 日志文件前缀
      prefix: access_log
      # 日志文件后缀
      suffix: .log
      # 日志文件编码格式。默认使用系统编码
      encoding:
      # 时间使用的区域。默认系统语言区域
      locale:
      # 是否检查日志文件是否存在。默认：false
      check-exists: false
      # 在删除访问日志文件之前保留访问日志文件的天数。默认：-1（一直保留）
      max-days: -1
      # 日志文件名中的日期格式
      file-date-format: '.yyyy-MM-dd'
      # 是否缓冲输出，使其仅定期刷新。默认：true
      buffered: true
      # 是否仅在“ServletRequest.getAttribute(conditionIf)”不为null时启用请求日志记录
      condition-if:
      # 是否仅在“ServletRequest.getAttribute(conditionUnless)”为null时启用请求日志记录
      condition-unless:
      # 是否开启日志轮换。默认：true
      rotate: true
      # 是否将文件名中的日期戳推迟到轮换时间。默认：false
      rename-on-rotate: false
      # 是否使用RFC 5952定义的IPv6规范表示格式。默认：false
      ipv6-canonical: false
      # 设置用于请求的IP地址、主机名、协议和端口的请求属性。默认：false
      request-attributes-enabled: false
    # Tomcat静态资源配置
    resource:
      # 是否允许静态资源缓存。默认：true
      allow-caching: true
      # 静态资源缓存的生存时间
      cache-ttl:
    # Remote IP配置
    remoteip:
      # 与要信任的代理匹配的正则表达式。默认：10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|100\.6[4-9]{1}\.\d{1,3}\.\d{1,3}|100\.[7-9]{1}\d{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1]{1}\d{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]{1}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|100\.6[4-9]{1}\.\d{1,3}\.\d{1,3}|100\.[7-9]{1}\d{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1]{1}\d{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]{1}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1'
      # 保存传入协议的标头，通常命名为“X-Forwarded-Proto”。
      protocol-header:
      # 指示传入请求是否使用SSL的协议标头的值。默认：https
      protocol-header-https-value: https
      # 从中提取远程主机的HTTP标头的名称。默认：X-Forwarded-Host
      host-header: 'X-Forwarded-Host'
      # 从中提取远程端口的HTTP标头的名称。默认：X-Forwarded-Port
      port-header: 'X-Forwarded-Port'
      # 从中提取远程IP的HTTP标头的名称。
      remote-ip-header:
    # MBean注册表配置
    mbeanregistry:
      # 是否启用Tomcat的MBean注册表
      enabled: false
  # Undertow配置（三大嵌入式服务器选一即可）
  undertow:
    # Undertow线程配置
    threads:
      # 工作线程创建的I/O线程数。默认：可用处理器的数量
      io:
      # 工作线程数。默认值为I/O线程数的8倍
      worker:
    # HTTP POST内容的最大大小。当值为-1时，大小不受限制。默认：-1B
    max-http-post-size: -1
    # 每个缓冲区的大小
    buffer-size:
    # 是否在Java堆外部分分配缓冲区
    direct-buffers:
    # 是否在启动时初始化servlet过滤器。默认：true
    eager-filter-init: true
    # 允许的最大查询或路径参数数。存在此限制是为了防止基于哈希冲突的DOS攻击。默认：1000
    max-parameters: 1000
    # 允许的最大标头数。存在此限制是为了防止基于哈希冲突的DOS攻击。默认：200
    max-headers: 200
    # 允许的最大Cookie数。存在此限制是为了防止基于哈希冲突的DOS攻击。默认：200
    max-cookies: 200
    # 是否应解码URL。默认：true
    decode-url: true
    # 解码URL的字符集。默认：UTF-8
    url-charset: UTF-8
    # 是否应将“Connection: keep-alive”标头添加到所有响应中，即使 HTTP 规范不要求也是如此。默认：true
    always-set-keep-alive: true
    # 在服务器关闭连接之前，连接在不处理请求的情况下可以处于空闲状态的时间
    no-request-timeout:
    # 是否在转发请求时保留请求的路径。默认：false
    preserve-path-on-forward: false
    # 访问日志配置
    accesslog:
      # 是否启用访问日志，默认：false
      enabled: false
      # 访问日志的格式模式。默认：common
      pattern: common
      # 日志文件目录。默认：logs
      dir: logs
      # 日志文件前缀
      prefix: access_log.
      # 日志文件后缀
      suffix: log
      # 是否开启访问日志轮换
      rotate: true
    # 服务器选项
    options:
      # org.xnio.Options中定义的套接字选项
      socket:
      # io.undertow.UndertowOptions中定义的服务器选项
      server:
  # Jetty配置（三大嵌入式服务器选一即可）
  jetty:
    # 线程配置
    threads:
      # 接受器线程数。默认：-1
      acceptors: -1
      # 选择器线程数。默认：-1
      selectors: -1
      # 最大线程数。默认：200
      max: 200
      # 最小线程数。默认：8
      min: 8
      # 线程队列的最大容量。
      max-queue-capacity:
      # 最大线程空闲时间。默认：60000ms
      idle-timeout: 60000ms
    # 连接在关闭之前可以处于空闲状态的时间
    connection-idle-timeout:
    # 请求中表单内容的最大大小。默认：200000B
    max-http-form-post-size: 200000B
    # 访问日志配置
    accesslog:
      # 是否启用访问日志。默认：false
      enabled: false
      # 日志格式。默认：ncsa。可选：ncsa、extended_ncsa
      format: ncsa
      # 自定义日志格式。如果设置将覆盖format指定的日志格式
      custom-format:
      # 日志文件名。如果未指定，日志将重定向到“System.err”
      filename:
      # 日志文件名中的日期格式
      file-date-format:
      # 日志文件保留的天数。默认：31天
      retention-period: 31
      # 追加到日志。默认：false
      append: false
      # 不记录的请求路径
      ignore-paths:
        -
  # Netty配置
  netty:
    # 通道的连接超时时间
    connection-timeout:
    # H2C升级请求的最大内容长度。默认：0B
    h2c-max-content-length: 0
    # HTTP请求解码的初始缓冲区大小。默认：128B
    initial-buffer-size: 128
    # HTTP请求解码的最大区块大小。默认：8KB
    max-chunk-size: 8KB
    # HTTP请求的初始行解码的最大长度。默认：4KB
    max-initial-line-length: 4KB
    # 每个连接可以发出的最大请求数。默认情况下，连接为无限数量的请求提供服务。
    max-keep-alive-requests:
    # 解码请求时是否验证标头。默认：true
    validate-headers: true
    # 通道的空闲超时。如果未指定，则无限超时。
    idle-timeout:
  # HTTP/2配置
  http2:
    # 是否开启HTTP/2支持。默认：false
    enabled: false
  # SSL配置
  ssl:
    # 是否开启SSL支持。默认：true
    enabled: true
    # 客户端身份验证类型。可选：none、want、need
    client-auth:
    # 支持的SSL cipher
    ciphers:
    # 已启用的SSL协议
    enabled-protocols:
    # 密钥库中密钥的别名
    key-alias:
    # 密钥库中密钥的密码
    key-password:
    # 保存SSL证书的密钥库（通常为jks文件）的路径
    key-store:
    # 密钥库的密码
    key-store-password:
    # 密钥库类型
    key-store-type:
    # 密钥库提供者
    key-store-provider:
    # 信任存储的路径
    trust-store:
    # 信任存储的密码
    trust-store-password:
    # 信任存储的类型
    trust-store-type:
    # 信任存储的提供者
    trust-store-provider:
    # PEM编码的SSL证书文件的路径
    certificate:
    # 私钥文件的路径
    certificate-private-key:
    # 证书颁发机构文件的路径
    trust-certificate:
    # 证书颁发机构私钥文件的路径
    trust-certificate-private-key:
    # SSL协议。默认TLS
    protocol: TLS
  # 错误处理配置
  error:
    # Error Controller 访问路径
    path: /error
    # 是否包含“exception”属性。默认：false
    include-exception: true
    # 包含“trace”属性策略。默认：never。可选：never、always、on_param
    include-stacktrace: never
    # 包含“message”属性策略。默认：never。可选：never、always、on_param
    include-message: never
    # 包含“errors”属性策略。默认：never。可选：never、always、on_param
    include-binding-errors: never
    whitelabel:
      # 是否启用服务器错误时浏览器中显示的默认错误页面。默认：true
      enabled: true
