management:
  # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.actuator.management.endpoints.enabled-by-default
  endpoints:
    enabled-by-default:
    migrate-legacy-ids:
    # org.springframework.boot.actuate.autoconfigure.endpoint.web.WebEndpointProperties
    web:
      base-path: /actuator
      path-mapping:
      discovery:
        enabled:
      exposure:
        exclude:
      # org.springframework.boot.actuate.autoconfigure.endpoint.web.CorsEndpointProperties
      cors:
        allowed-origins:
        allowed-origin-patterns:
        allowed-headers:
        allowed-methods:
        allow-credentials:
        exposed-headers:
        max-age:
    jackson:
      isolated-object-mapper:
    # org.springframework.boot.actuate.autoconfigure.endpoint.jmx.JmxEndpointProperties
    jmx:
      domain:
      static-names:
      exposure:
        include:
        exclude:
