management:
  # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.actuator.management.kairos.metrics.export.user-name
  # org.springframework.boot.actuate.autoconfigure.metrics.MetricsProperties
  metrics:
    use-global-registry: true
    enable:
    tags:
    web:
      server:
        max-uri-tags: 100
        request:
          metric-name: http.server.requests
          ignore-trailing-slash: true
          autotime:
            enabled: true
            percentiles-histogram: false
            percentiles:
      client:
        max-uri-tags: 100
        request:
          metric-name: http.client.requests
          autotime:
            enabled: true
            percentiles-histogram: false
            percentiles:
    system:
      diskspace:
        paths:
          - '.'
    data:
      repository:
        metric-name: spring.data.repository.invocations
        autotime:
          enabled: true
          percentiles-histogram: false
          percentiles:
    graphql:
      autotime:
        enabled: true
        percentiles-histogram: false
        percentiles:
    distribution:
      expiry:
      maximum-expected-value:
      minimum-expected-value:
      buffer-length:
      percentiles:
      percentiles-histogram:
      slo:
    mongo:
      command:
        enabled:
    connectionpool:
      enabled:
