spring:
  # H2配置
  h2:
    # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data.spring.h2.console.enabled
    # org.springframework.boot.autoconfigure.h2.H2ConsoleProperties
    # H2控制台配置
    console:
      # 是否开启控制台。默认：false
      enabled: false
      # 控制台可用的路径。默认：/h2-console
      path: /h2-console
      # 控制台设置配置
      settings:
        # 是否启用跟踪输出。默认：false
        trace: false
        # 是否启用远程访问。默认：false
        web-allow-others: false
        # 访问H2控制台的密码
        web-admin-password:
