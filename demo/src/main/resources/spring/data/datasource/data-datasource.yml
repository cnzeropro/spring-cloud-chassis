spring:
  # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data.spring.datasource.driver-class-name
  # org.springframework.boot.autoconfigure.jdbc.DataSourceProperties
  # 数据源配置
  datasource:
    # 数据库用户名
    username: root
    # 数据库密码
    password: mysql
    # 数据库URL
    url: jdbc:mysql://192.168.0.100:3306/test?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&useSSL=false
    # 数据库驱动。可以不用配置，自动根据url自动识别dbType
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据源类型。无需配置，自动侦测
    type: com.alibaba.druid.pool.DruidDataSource
    # 是否生成随机数据源名称。默认：true
    generate-unique-name: false
    # 数据源名称
    name: Datasource-MySQL
    # 嵌入式数据库的连接详细信息。默认自动侦测。可选：none、h2、hsqldb、derby
    embedded-database-connection: none
    # 数据源JNDI位置
    jndi-name:
    # 特定数据源的XA设置
    xa:
      # XA数据源类名称
      data-source-class-name:
      # XA数据源配置
      properties:
