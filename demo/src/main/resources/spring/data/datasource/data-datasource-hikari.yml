spring:
  datasource:
    # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data.spring.datasource.hikari
    # com.zaxxer.hikari.HikariDataSource
    # HikariCP配置
    hikari:
      # JDBC连接地址
      jdbc-url:
      # 用户名
      username:
      # 密码
      password:
      # 默认模式名称
      schema:
      # 驱动类名称
      driver-class-name:
      # 连接池名称
      pool-name:
      # 数据源类名称
      data-source-class-name:
      # 数据源JNDI名称
      data-source-j-n-d-i:
      # 默认目录名称
      catalog:
      # 连接超时时间，单位毫秒
      connection-timeout:
      # 验证连接时的最大时间，单位毫秒
      validation-timeout:
      # 连接空闲的最长时间，单位毫秒
      idle-timeout:
      # 连接池初始化失败超时时间，单位毫秒
      initialization-fail-timeout:
      # 可能存在连接泄漏的消息之前连接可以离开池的时间量。值为0表示禁用泄漏检测
      leak-detection-threshold:
      # 连接的最长生存期
      max-lifetime:
      # 连接池最大数量
      maximum-pool-size:
      # 最小空闲连接数
      minimum-idle:
      # 连接新建时需要执行的SQL语句
      connection-init-sql:
      # 连接测试的SQL语句
      connection-test-query:
      # SQLExceptionOverride类名称
      exception-override-class-name:
      # 事务隔离级别
      transaction-isolation:
      # 是否自动提交
      auto-commit:
      # 连接是否只读
      read-only:
      # 确定内部池查询（主要是活动性检查）是否将通过Connection.rollback()隔离在它们自己的事务中
      isolate-internal-queries:
      # 是否会在JMX中自行注册
      register-mbeans:
      # 是否允许池暂停
      allow-pool-suspension:
      # 连接的keepalive间隔
      keepalive-time:
      # 数据源额外配置
      data-source-properties:
      # 健康检查配置
      health-check-properties:
