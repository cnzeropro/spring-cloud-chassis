spring:
  sql:
    # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data-migration.spring.sql.init.continue-on-error
    # org.springframework.boot.autoconfigure.sql.init.SqlInitializationProperties
    # 数据库初始化SQL配置
    init:
      # 是否启用SQL数据库的基于脚本的基本初始化。默认：true（已弃用。使用spring.sql.init.mode代替）
      enabled: true
      # 执行初始化时应用的模式。默认：embedded。可选：embedded、never、always
      mode: embedded
      # 初始化脚本时要使用的数据库用户名
      username:
      # 初始化脚本时要使用的数据库密码
      password:
      # 用于数据库的模式（DDL）脚本的位置
      schema-locations:
      # 用于数据库的数据（DML）脚本的位置
      data-locations:
      # 要在默认模式或数据脚本位置（schema-${platform}.sql和data-${platform}.sql）中使用的平台。默认：all
      platform: all
      # 发生错误时是否应继续初始化。默认：false
      continue-on-error: false
      # 模式和数据脚本中的语句分隔符。默认：;
      separator: ';'
      # 模式和数据脚本的编码
      encoding:
