spring:
  # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data-migration.spring.flyway.baseline-description
  # org.springframework.boot.autoconfigure.flyway.FlywayProperties
  # Flyway配置
  flyway:
    # 是否启用Flyway。默认：true
    enabled: true
    # 数据库URL。如果未设置，则使用主配置的数据源
    url:
    # 数据库登录用户
    user:
    # 数据库登录密码
    password:
    # JDBC驱动程序的完全限定类名。默认情况下，根据 URL 自动检测
    driver-class-name:
    # SQL文件编码。默认：UTF-8
    encoding: UTF-8
    # 初始化连接时需要执行的SQL语句
    init-sqls:
    # 如果迁移脚本的位置不存在，是否失败。默认：false
    fail-on-missing-locations: false
    # 迁移脚本的位置。默认：classpath:db/migration
    locations:
      - classpath:db/migration
    # 尝试连接到数据库时的最大重试次数。默认：0
    connect-retries: 0
    # 尝试连接到数据库时重试之间的最长时间。默认：120
    connect-retries-interval: 120
    # 尝试获取锁时的最大重试次数。默认：50
    lock-retry-count: 50
    # 默认模式名称
    default-schema:
    # 是否尝试创建schemas属性中指定的模式
    create-schemas: true
    # 管理的模式名称
    schemas:
    # 模式历史记录表的名称。默认：flyway_schema_history
    table: flyway_schema_history
    # 模式历史记录表的表空间。使用不支持表空间的数据库时将忽略
    tablespace:
    # 迁移到非空schema时是否自动调用基线。默认：false
    baseline-on-migrate: false
    # 应用基线时用于标记现有模式的说明。默认：<< Flyway Baseline >>
    baseline-description: '<< Flyway Baseline >>'
    # 执行基线时用于标记现有模式的版本。默认：1
    baseline-version: 1
    # 基线迁移文件名的前缀。默认：B
    baseline-migration-prefix: B
    # 在模式历史记录表中需要记录的已应用迁移的用户名
    installed-by:
    # 迁移脚本中占位符的前缀。默认：${
    placeholder-prefix: '${'
    # 迁移脚本中占位符的后缀。默认：}
    placeholder-suffix: '}'
    # 默认占位符的分隔符。默认：：
    placeholder-separator: ':'
    # 在迁移脚本中执行占位符替换。默认：true
    placeholder-replacement: true
    # 迁移脚本中占位符的前缀。默认：FP__
    script-placeholder-prefix: 'FP__'
    # 迁移脚本中占位符的后缀。默认：__
    script-placeholder-suffix: '__'
    # 应用于sql迁移脚本的占位符及其替换项
    placeholders:
    # SQL迁移的文件名前缀。默认：V
    sql-migration-prefix: V
    # SQL迁移的文件名后缀。默认：.sql
    sql-migration-suffixes:
      - .sql
    # SQL迁移的文件名分隔符。默认：__
    sql-migration-separator: '__'
    # 可重复运行的SQL迁移的文件名前缀。默认：R
    repeatable-sql-migration-prefix: R
    # 应考虑迁移的目标版本。
    target:
    # 是否禁用数据库清理。默认：false
    clean-disabled: false
    # 是否在发生验证错误时自动调用clean。默认：false
    clean-on-validation-error: false
    # 是否将所有挂起的迁移组合到同一事务中。默认：false
    group: false
    # 是否允许在同一迁移中混合使用事务性和非事务性语句。默认：false
    mixed: false
    # 是否允许迁移无序运行。默认：false
    out-of-order: false
    # 是否跳过默认回调。默认：false
    skip-default-callbacks: false
    # 是否跳过默认解析程序。默认：false
    skip-default-resolvers: false
    # 是否验证脚本不遵循正确命名约定的迁移和回调。默认：false
    validate-migration-naming: false
    # 是否在执行迁移时自动调用validate。默认：true
    validate-on-migrate: true
    # 执行SQL语句时是否对其进行批处理
    batch:
    # 覆盖特定SQL状态和错误代码的内置错误处理规则
    error-overrides:
    # Flyway Teams许可证密钥
    license-key:
    # 是否启用对Oracle SQL*Plus命令的支持
    oracle-sqlplus:
    # 在遇到尚不支持的Oracle SQL*Plus语句时是否发出警告而不是错误
    oracle-sqlplus-warn:
    # Oracle Kerberos缓存文件的路径
    oracle-kerberos-cache-file:
    # Oracle Wallet的位置，用于自动登录数据库
    oracle-wallet-location:
    # 是否对SQL迁移进行流式处理
    stream:
    # 在迁移或撤消时应考虑的迁移。如果为空，则考虑所有可用的迁移
    cherry-pick:
    # JDBC驱动程序属性配置
    jdbc-properties:
    # Kerberos配置文件路径
    kerberos-config-file:
    # 是否应输出包含查询结果的表
    output-query-results:
    # SQL Server Kerberos登录文件的路径
    sql-server-kerberos-login-file:
    # 是否应该跳过执行迁移的内容，而只更新模式历史记录表
    skip-executing-migrations:
    # 在验证迁移时需要忽略的迁移
    ignore-migration-patterns:
    # 是否尝试自动检测SQL迁移文件编码
    detect-encoding:
    # 读取模式历史记录表时是否忽略将来的迁移。默认：true（已过时，使用spring.flyway.ignore-migration-patterns代替）
    ignore-future-migrations: true
    # 读取模式历史记录表时是否忽略忽略的迁移。默认：false（已过时，使用spring.flyway.ignore-migration-patterns代替）
    ignore-ignored-migrations: false
    # 读取模式历史记录表时是否忽略缺失的迁移。默认：false（已过时，使用spring.flyway.ignore-migration-patterns代替）
    ignore-missing-migrations: false
    # 读取模式历史记录表时是否忽略挂起的迁移。默认：false（已过时，使用spring.flyway.ignore-migration-patterns代替）
    ignore-pending-migrations: false
