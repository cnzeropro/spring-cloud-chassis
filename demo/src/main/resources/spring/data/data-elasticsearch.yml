spring:
  # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data.spring.elasticsearch.connection-timeout
  # org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchProperties
  # Elasticsearch配置
  elasticsearch:
    # Elasticsearch连接地址。默认：http://localhost:9200
    uris:
      - http://localhost:9200
    # Elasticsearch用户名
    username:
    # Elasticsearch密码
    password:
    # 连接超时时间。默认：1s
    connection-timeout: 1s
    # 套接字超时时间。默认：30s
    socket-timeout: 30s
    # 添加到发送到Elasticsearch的每个请求的路径中的前缀
    path-prefix:
    # Elasticsearch Webclient配置
    webclient:
      # 限制每当需要聚合输入流时可以缓冲的字节数
      max-in-memory-size:
    # org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientProperties
    # Elasticsearch RestClient配置
    restclient:
      # 嗅探配置
      sniffer:
        # 连续普通嗅探执行之间的间隔。默认：5m
        interval: 5m
        # 失败后计划的嗅探执行延迟。默认：1m
        delay-after-failure: 1m
    # org.springframework.boot.autoconfigure.elasticsearch.DeprecatedElasticsearchRestClientProperties
    # Elasticsearch REST客户端配置（从2.6.0开始已弃用，从3.0.0开始已移除。使用spring.elasticsearch代替）
    rest:
      # Elasticsearch连接地址。默认：http://localhost:9200
      uris:
        - http://localhost:9200
      # Elasticsearch用户名
      username:
      # Elasticsearch密码
      password:
      # 连接超时时间。默认：1s
      connection-timeout: 1s
      # 读取超时时间。默认：30s
      read-timeout: 30s
      # 嗅探配置（从2.6.0开始已弃用，从3.0.0开始已移除。使用spring.elasticsearch.restclient.sniffer代替）
      sniffer:
        # 连续普通嗅探执行之间的间隔。默认：5m
        interval: 5m
        # 失败后计划的嗅探执行延迟。默认：1m
        delay-after-failure: 1m
  data:
    # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data.spring.data.elasticsearch.repositories.enabled
    # Elasticsearch配置
    elasticsearch:
      # 存储库配置
      repositories:
        # 是否开启Elasticsearch仓库。默认：true
        enabled: true
      # 客户端配置
      client:
        # org.springframework.boot.autoconfigure.data.elasticsearch.DeprecatedReactiveElasticsearchRestClientProperties
        # Reactive客户端配置（从2.6.0开始已弃用，从3.0.0开始已移除。使用spring.elasticsearch代替）
        reactive:
          # Elasticsearch连接地址。默认：http://localhost:9200
          endpoints:
            - http://localhost:9200
          # Elasticsearch用户名
          username:
          # Elasticsearch密码
          password:
          # 是否使用SSL。默认：false
          use-ssl: false
          # 连接超时时间
          connection-timeout:
          # 套接字超时时间
          socket-timeout:
          # 限制每当需要聚合输入流时可以缓冲的字节数
          max-in-memory-size:
