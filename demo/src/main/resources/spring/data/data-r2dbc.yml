spring:
  # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data.spring.r2dbc.generate-unique-name
  # org.springframework.boot.autoconfigure.r2dbc.R2dbcProperties
  # R2DBC配置
  r2dbc:
    # 数据库的R2DBC URL
    url:
    # 数据库的登录用户名
    username:
    # 数据库的登录密码
    password:
    # 数据库名称。使用嵌入式数据库时默认为“testdb”。
    name:
    # 是否生成随机数据库名称。默认：false
    generate-unique-name: false
    # 连接池配置
    pool:
      # 是否启用池化。需要 r2dbc-pool。默认：true
      enabled: true
      # 最少的空闲连接数。默认：0
      min-idle: 0
      # 初始连接池大小。默认：10
      initial-size: 10
      # 最大连接池大小。默认：10
      max-size: 10
      # 允许连接在池中处于空闲状态的最长时间。默认：30m
      max-idle-time: 30m
      # 池中连接的最长生存期。默认情况下，连接具有无限的生存期
      max-life-time:
      # 从池中获取连接的最长时间。默认情况下，无限期等待
      max-acquire-time:
      # 验证池中连接的最长时间。默认情况下，无限期等待。
      max-validation-time:
      # 等待创建新连接的最长时间。默认情况下，无限期等待。
      max-create-connection-time:
      # 验证查询
      validation-query:
      # 验证深度。默认：local。可选：local、remote
      validation-depth: local
    properties:
  # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data.spring.data.r2dbc.repositories.enabled
  data:
    # R2DBC配置
    r2dbc:
      # 存储库配置
      repositories:
        # 是否启用R2DBC存储库。默认：true
        enabled: true
