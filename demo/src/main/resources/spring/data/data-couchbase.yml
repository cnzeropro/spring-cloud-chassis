spring:
  # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data.spring.couchbase.connection-string
  # org.springframework.boot.autoconfigure.couchbase.CouchbaseProperties
  # Couchbase配置
  couchbase:
    # Couchbase连接地址
    connection-string:
    # Couchbase用户名
    username:
    # Couchbase密码
    password:
    # Couchbase环境配置
    env:
      # IO配置
      io:
        # 每个节点的最小套接字数。默认：1
        min-endpoints: 1
        # 每个节点的最大套接字数。默认：12
        max-endpoints: 12
        # 保持空闲状态的最大时间。默认：4.5s
        idle-http-connection-timeout: 4500ms
      # SSL配置
      ssl:
        # 是否用SSL支持。如果提供了keyStore，则自动启用
        enabled:
        # 保存证书的JVM密钥库的路径
        key-store:
        # 访问密钥库的密码
        key-store-password:
      # 超时设置
      timeouts:
        # 存储桶连接超时。默认：10s
        connect: 10s
        # 存储桶断开连接超时。默认：10s
        disconnect: 10s
        # 对特定键值执行操作的超时。默认：2.5s
        key-value: 2500ms
        # 对具有持久性级别的特定键值执行操作的超时。默认：10s
        key-value-durable: 10s
        # N1QL查询操作超时。默认：75s
        query: 75s
        # 常规视图和地理空间视图操作超时。默认：75s
        view: 75s
        # 搜索服务的超时。默认：75s
        search: 75s
        # 分析服务的超时。默认：75s
        analytics: 75s
        # 管理操作超时。默认：75s
        management: 75s
  data:
    # org.springframework.boot.autoconfigure.data.couchbase.CouchbaseDataProperties
    # Couchbase配置
    couchbase:
      # 自动创建视图和索引。默认：false
      auto-index: false
      # 要连接到的存储桶的名称。
      bucket-name:
      # 所有集合访问的范围的名称。
      scope-name:
      # 字段命名策略
      field-naming-strategy:
      # 使用“MappingCouchbaseConverter”时存储复杂类型类型信息的字段名称。默认：_class
      type-key: _class
