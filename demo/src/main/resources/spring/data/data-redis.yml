spring:
  # org.springframework.boot.autoconfigure.data.redis.RedisProperties
  # Redis配置
  redis:
    # 连接URL
    url:
    # 主机
    host: localhost
    # 端口
    port: 6379
    # 用户名
    username:
    # 密码
    password:
    # 数据库
    database: 0
    # 是否启用SSL支持。默认：false
    ssl: false
    timeout:
    # 连接超时
    connect-timeout:
    # 要在使用CLIENT SETNAME的连接上设置的客户端名称
    client-name:
    # 要使用的客户端类型。默认情况下，根据类路径自动检测。可选：lettuce、jedis
    client-type: lettuce
    # 哨兵配置
    sentinel:
      # Redis服务器的名称
      master:
      # 节点列表
      nodes:
        - 192.168.0.100:6379
        - 192.168.0.101:6379
      # 用于向哨兵进行身份验证的登录用户名
      username:
      # 用于向哨兵进行身份验证的登录密码
      password:
    # 集群配置
    cluster:
      # 群集节点的“初始”列表
      nodes:
        - 192.168.0.100:6379
        - 192.168.0.101:6379
        - 192.168.0.102:6379
      # 在群集中执行命令时要遵循的最大重定向数
      max-redirects:
      # Jedis客户端配置
    jedis:
      # 连接池配置
      pool:
        # 是否启用池。如果“commons-pool2”可用，则自动启用。使用 Jedis 时，池化在哨兵模式下隐式启用，此设置仅适用于单节点设置
        enabled:
        # 最小空闲连接数。默认：0
        min-idle: 0
        # 最大空闲连接数。负值表示无限.默认：8
        max-idle: 8
        # 可分配的最大连接数。负值表示无限。默认：8
        max-active: 8
        # 连接分配应阻塞的最长时间。使用负值可无限期阻止。默认：-1（无超时）
        max-wait: -1
        # 空闲对象逐出线程运行之间的时间
        time-between-eviction-runs:
    # Lettuce客户端配置
    lettuce:
      # 关机超时。默认：100ms
      shutdown-timeout: 100ms
      # 连接池配置
      pool:
        # 是否启用池。如果“commons-pool2”可用，则自动启用。使用 Jedis 时，池化在哨兵模式下隐式启用，此设置仅适用于单节点设置
        enabled:
        # 最小空闲连接数。默认：0
        min-idle: 0
        # 最大空闲连接数。负值表示无限.默认：8
        max-idle: 8
        # 可分配的最大连接数。负值表示无限。默认：8
        max-active: 8
        # 连接分配应阻塞的最长时间。使用负值可无限期阻止。默认：-1（无超时）
        max-wait: -1
        # 空闲对象逐出线程运行之间的时间
        time-between-eviction-runs:
      # 集群配置
      cluster:
        # 刷新配置
        refresh:
          # 是否发现和查询所有集群节点以获取集群拓扑。默认：true
          dynamic-refresh-sources: true
          # 群集拓扑刷新周期
          period:
          # 是否应使用使用所有可用刷新触发器的自适应拓扑刷新。默认：false
          adaptive: false
  data:
    # Redis配置
    redis:
      # 存储库配置
      repositories:
        # 是否开启Redis仓库。默认：true
        enabled: true
