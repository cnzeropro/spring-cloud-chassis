spring:
  data:
    # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data.spring.data.rest.base-path
    # org.springframework.boot.autoconfigure.data.rest.RepositoryRestProperties
    # Spring Data REST配置
    rest:
      # 公开存储库资源的基本路径
      base-path:
      # 默认每页大小
      default-page-size:
      # 最大每页大小
      max-page-size:
      # 页码参数名称
      page-param-name:
      # 每页限制参数名称
      limit-param-name:
      # 排序参数名称
      sort-param-name:
      # 存储库被公开的策略。默认：default。可选：default、all、annotated
      detection-strategy: default
      # 默认内容类型。可选：application_json等待
      default-media-type:
      # 创建实体后是否返回响应正文
      return-body-on-create:
      # 是否在更新实体后返回响应正文
      return-body-on-update:
      # 是否通过Spring Data REST默认资源包启用枚举值转换
      enable-enum-translation:
