spring:
  data:
    # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data.spring.cassandra.compression
    # org.springframework.boot.autoconfigure.cassandra.CassandraProperties
    # Cassandra配置
    cassandra:
      # Cassandra连接地址
      contact-points:
        - 192.168.0.100
      # Cassandra端口。默认：9042
      port: 9042
      # Cassandra用户名
      username:
      # Cassandra密码
      password:
      # 是否启用SSL支持。默认：false
      ssl: false
      # 配置文件的位置
      config:
      # Cassandra二进制协议支持的压缩。默认：none。可选：none、lz4、snappy
      compression: none
      # 启动时要执行的操作。默认：none
      schema-action: none
      # 本地数据中心
      local-datacenter:
      # 要使用的密钥空间名称
      keyspace-name:
      # Cassandra会话名称
      session-name:
      # 连接配置
      connection:
        # 连接超时时间。默认：5s
        connect-timeout: 5s
        # 在打开连接后作为初始化过程的一部分运行的内部查询的超时。默认：5s
        init-query-timeout: 5s
      # 连接池设置
      pool:
        # 空闲连接保留时间。默认：5s
        idle-timeout: 5s
        # 心跳检测间隔。默认：30s
        heartbeat-interval: 30s
      # 请求设置
      request:
        # 请求超时时间。默认：2s
        timeout: 2s
        # 查询一致性级别。可选：any、all、one、two、three、quorum、local_one、local_quorum、local_serial、serial、each_quorum
        consistency:
        # 查询串行一致性级别。可选：any、all、one、two、three、quorum、local_one、local_quorum、local_serial、serial、each_quorum
        serial-consistency:
        # 在单个网络往返中将同时检索多少行。默认：5000
        page-size: 5000
        # 请求限制设置
        throttler:
          # 请求限制类型。默认：none。可选：none、concurrency_limiting、rate_limiting
          type: none
          # 超过限制阈值时可以排队的最大请求数
          max-queue-size:
          # 允许并行执行的最大请求数
          max-concurrent-requests:
          # 允许的最大请求速率
          max-requests-per-second:
          # 限制程序尝试取消请求排队的频率
          drain-interval:
      # 控制连接设置
      controlconnection:
        # 控制查询的超时。默认：5s
        timeout: 5s
      repositories:
        # 要启用的Cassandra存储库的类型。默认：auto。可选：auto、imperative、none、reactive
        type: auto
