spring:
  # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data.spring.jdbc.template.fetch-size
  # org.springframework.boot.autoconfigure.jdbc.JdbcProperties
  # JDBC配置
  jdbc:
    # JdbcTemplat配置
    template:
      # 需要更多行时应从数据库中读取的行数。设置-1使用JDBC驱动程序的缺省配置。默认：-1
      fetch-size: -1
      # 最大行数。设置-1使用JDBC驱动程序的缺省配置。默认：-1
      max-rows: -1
      # 查询超时。缺省情况下，使用JDBC驱动程序的缺省配置。
      query-timeout:
  data:
    # https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.data.spring.data.jdbc.repositories.enabled
    # JDBC配置
    jdbc:
      # 存储库配置
      repositories:
        # 是否启用JDBC存储库。默认：true
        enabled: true
