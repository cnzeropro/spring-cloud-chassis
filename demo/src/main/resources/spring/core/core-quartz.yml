# https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.core.spring.quartz.auto-startup
# org.springframework.boot.autoconfigure.quartz.QuartzProperties
# Quartz配置
quartz:
  # 调度器名称。默认：quartzScheduler
  scheduler-name: quartzScheduler
  # 数据持久化方式。默认：memory。可选：memory、jdbc
  job-store-type: jdbc
  # 初始化后是否自动启动计划程序。默认：true
  auto-startup: true
  # 配置的作业是否应覆盖现有的作业定义。默认：false
  overwrite-existing-jobs: true
  # 初始化完成后启动计划程序的延迟时间。默认：0s
  startup-delay: 10s
  # 关闭时是否等待正在运行的作业完成。默认：false
  wait-for-jobs-to-complete-on-shutdown: false
  jdbc:
    # 初始化数据库架构的SQL文件的路径。默认：classpath:org/quartz/impl/jdbcjobstore/tables_@@platform@@.sql
    schema: 'classpath:org/quartz/impl/jdbcjobstore/tables_@@platform@@.sql'
    # 数据库架构初始化模式。默认：embedded。可选：always、embedded、never
    initialize-schema: embedded
    # 初始化脚本中使用的平台。默认情况下自动检测
    platform:
    # SQL初始化脚本中单行注释的前缀。默认：#,--
    comment-prefix:
      - '#'
      - '--'
  # http://www.quartz-scheduler.org/documentation/quartz-2.3.0/configuration/
  # Quartz原生的配置
  properties:
    org:
      quartz:
        jobStore:
          # JobStore实现类。
          # 详情参见：org.quartz.spi.JobStore及其子类
          # Quartz主要提供了以下几种：
          # org.quartz.simpl.RAMJobStore：内存存储机制实现类
          # org.quartz.impl.jdbcjobstore.JobStoreCMT：受应用容器管理事务的数据库存储实现类
          # org.quartz.impl.jdbcjobstore.JobStoreTX：不受应用容器事务管理的数据库存储实现类
          class: org.quartz.impl.jdbcjobstore.JobStoreTX
          # 数据库驱动代理。
          # Quartz也提供了很多，常见数据库的都有，详情参见：org.quartz.impl.jdbcjobstore.DriverDelegate及其子类
          driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
          # 表前缀，默认：QRTZ_
          tablePrefix: quartz_
          # 最大能忍受的触发超时时间，单位毫秒
          misfireThreshold: 12000
          # 是否加入集群
          isClustered: true
          # 调度实例失效的检查时间间隔，单位毫秒
          clusterCheckinInterval: 20000
        threadPool:
          # 线程池实现类，详情参见：org.quartz.spi.ThreadPool及其子类
          class: org.quartz.simpl.SimpleThreadPool
          threadCount: 10
          # 线程优先级，默认：Thread.NORM_PRIORITY（5）
          threadPriority: 5
          # 线程继承初始化线程的上下文类加载器
          threadsInheritContextClassLoaderOfInitializingThread: true
        scheduler:
          # 调度器实例名称
          # 如果指定了spring.quartz.scheduler-name属性，则优先以它为准，此时instanceName不会生效
          instanceName: quartzScheduler
          # 实例id，集群下的所有调度器实例id必须为唯一
          instanceId: AUTO
