# https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.core.logging.charset.console
# 日志记录配置
logging:
  # 日志级别映射
  level:
    root: info
    org:
      springframework:
        web: info
      apache: error
  # 日志的配置文件位置
  config: classpath:logback-spring.xml
  # 日志文件配置（请勿使用，已不受支持）
  file:
    # 日志文件位置
    path:
    # 日志文件名称
    name:
  # 日志格式配置
  pattern:
    # 日志中级别的格式。默认：%5p
    level: %5p
    # 输出到文件的日志格式。默认：%d{${LOG_DATEFORMAT_PATTERN：-yyyy-MM-dd HH：mm：ss。SSS}} ${LOG_LEVEL_PATTERN：-%5p} ${PID：- } --- [%t] %-40.40logger{39} ： %m%n${LOG_EXCEPTION_CONVERSION_WORD：-%wEx}
    file: "%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}} ${LOG_LEVEL_PATTERN:-%5p} ${PID:- } --- [%t] %-40.40logger{39} : %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
    # 输出到控制台的日志格式。默认：%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
    # 日志在日期时间的格式。默认：yyyy-MM-dd HH:mm:ss.SSS
    dateformat: "yyyy-MM-dd HH:mm:ss.SSS"
    # 滚动日志文件名的模式。仅支持默认日志系统（Logback）的设置。默认：${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz（已弃用）
    rolling-file-name: "${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz"
  # Logback配置
  logback:
    # 日志滚动策略
    rollingpolicy:
      # 在系统启动时清除历史日志。默认：false
      clean-history-on-start: false
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz"
      # 最大日志文件大小。默认：10MB
      max-file-size: 10MB
      # 要保留的归档日志文件的最大数量。默认：7
      max-history: 7
      # 要保留的日志备份的总大小。默认：0B
      total-size-cap: 0
  # Log4j2配置
  log4j2:
    config:
      # 覆盖用于创建复合配置的配置文件
      override:
  # 字符集配置
  charset:
    # 文件输出的字符集
    file: UTF-8
    # 控制台输出的字符集
    console: UTF-8
  # 指定日志组映射关系。日志组可同时快速更改多个记录器
  group:
  # 记录异常时使用的转换词。默认：%wEx
  exception-conversion-word: %wEx
  # 在初始化日志记录系统时为其注册一个关闭挂钩。默认：true。部署为war时自动禁用。
  register-shutdown-hook: true
