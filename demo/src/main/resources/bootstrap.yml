spring:
  application:
    name: @artifactId@
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:${NACOS_HOST:nacos}:${NACOS_PORT:8848}}
      username: @nacos.username@
      password: @nacos.password@
      # nacos 服务注册与发现
      # 配置参考地址：https://sca.aliyun.com/zh-cn/docs/next/user-guide/nacos/advanced-guide/#%E9%85%8D%E7%BD%AE%E9%A1%B9%E5%8F%82%E8%80%83
      discovery:
        enabled: true
        server-addr: ${spring.cloud.nacos.server-addr}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER_NAME:DEFAULT}
        # 权重。取值范围 1 到 100，数值越大，权重越大
        weight: ${NACOS_WEIGHT:1.0}
        watch:
          enabled: true
        # 网卡名。默认使用第一块网卡（多网卡使用）
        network-interface:
        # 注册的IP地址。默认是注册网卡的IP（多网卡使用，此配置优先级高于spring.cloud.nacos.discovery.network-interface）
        ip:
        ip-type: IPv4
      # nacos 配置中心
      # 配置参考地址：https://sca.aliyun.com/zh-cn/docs/next/user-guide/nacos/advanced-guide/#%E9%85%8D%E7%BD%AE%E9%A1%B9%E5%8F%82%E8%80%83-1
      config:
        enabled: true
        server-addr: ${spring.cloud.nacos.server-addr}
        namespace: ${spring.cloud.nacos.discovery.namespace}
        group: ${spring.cloud.nacos.discovery.group}
        cluster-name: ${spring.cloud.nacos.discovery.cluster-name}
        encode: UTF-8
        # DataId的前缀，默认值为应用名称
        prefix: ${spring.application.name}
        # 文件扩展名（DataId的后缀），默认：properties。目前支持properties、yml
        file-extension: yml
        # 配置（DataId的名称，一般不指定）（在以下三类配置中优先级最低，name < extension-configs < shared-configs）
        # 默认生成规则：${spring.cloud.nacos.config.prefix}-${spring.profile.active}.${spring.cloud.nacos.config.file-extension}
        # 注意：spring cloud alibaba 2021.0.1.0版本以上已更新到spring.config.import配置项，并且需要写在application.yml，如果还想保留以前的使用方式（bootstrap引入配置），只需要添加依赖spring-cloud-starter-bootstrap即可。三类配置皆如此
        name: application-${spring.config.activate.on-profile}.${spring.cloud.nacos.config.file-extension}
        # 扩展配置
        extension-configs:
          - dataId: ${spring.application.name}-${spring.config.activate.on-profile}.${spring.cloud.nacos.config.file-extension}
            group: DEFAULT_GROUP
            refresh: true
        # 共享配置
        shared-configs:
          # 默认不会自动刷新
          - dataId: common-${spring.config.activate.on-profile}.${spring.cloud.nacos.config.file-extension}
            group: DEFAULT_GROUP
    loadbalancer:
      nacos:
        enabled: true
  config:
    activate:
      # 从SpringBoot 2.4.0 开始，spring.profiles.active配置项过时，使用该配置项代替
      on-profile: @profiles.active@
    import:
      - optional:nacos:application-${spring.config.activate.on-profile}.${spring.cloud.nacos.config.file-extension}
      - optional:nacos:${spring.application.name}-${spring.config.activate.on-profile}.${spring.cloud.nacos.config.file-extension}?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:common-${spring.config.activate.on-profile}.${spring.cloud.nacos.config.file-extension}?group=DEFAULT_GROUP
