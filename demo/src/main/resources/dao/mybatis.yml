# org.mybatis.spring.boot.autoconfigure.MybatisProperties
# MyBatis配置
mybatis:
  check-config-location: false
  config-location:
  mapper-locations:
  type-aliases-package:
  type-aliases-super-type:
  type-handlers-package:
  executor-type:
  default-scripting-language-driver:
  configuration:
    safe-row-bounds-enabled:
    safe-result-handler-enabled: true
    map-underscore-to-camel-case:
    aggressive-lazy-loading:
    multiple-result-sets-enabled: true
    use-generated-keys:
    use-column-label: true
    cache-enabled: true
    call-setters-on-nulls:
    use-actual-param-name: true
    return-instance-for-empty-row:
    shrink-whitespaces-in-sql:
    nullable-on-for-each:
    arg-name-based-constructor-auto-mapping:
    log-prefix:
    log-impl:
    vfs-impl:
    default-sql-provider-type:
    local-cache-scope: SESSION
    jdbc-type-for-null: OTHER
    lazy-load-trigger-methods:
      - equals
      - clone
      - hashCode
      - toString
    default-statement-timeout:
    default-fetch-size:
    default-result-set-type:
    default-executor-type: SIMPLE
    auto-mapping-behavior: PARTIAL
    auto-mapping-unknown-column-behavior: NONE
    lazy-loading-enabled: false
    database-id:
    configuration-factory:
    mapped-statements:
    mapped-statement-names:
    caches:
    cache-names:
    result-maps:
    result-map-names:
    parameter-maps:
    parameter-map-names:
    key-generators:
    key-generator-names:
    incomplete-statements:
    incomplete-cache-refs:
    incomplete-methods:
    incomplete-result-maps:
    interceptors:
    reflector-factory:
    object-factory:
    object-wrapper-factory:
    proxy-factory:
    environment:
    sql-fragments:
    variables:
  configuration-properties:
